<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホットクック メニューブラウザ</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E23B2E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ホットクック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="titlerow">
      <h1>ホット<span class="k">クック</span> メニューブラウザ</h1>
      <span class="count" id="count"></span>
      <button class="modelbadge" id="modelbadge" type="button" title="機種を選ぶ・変更する"></button>
      <button class="addbtn" id="add-recipe" type="button" title="自分のレシピを追加" aria-label="自分のレシピを追加">＋</button>
    </div>
    <div class="searchrow">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="料理名・材料・番号で検索（例: カレー / 大根 / 790）" autocomplete="off">
      </label>
      <button class="fbtn" id="f-toggle" type="button" aria-expanded="false" aria-controls="filters">
        絞り込み<span class="fbadge" id="fbadge" hidden></span>
      </button>
    </div>
    <div class="filters" id="filters">
      <div class="controls">
        <select id="model" title="お使いの機種"><option value="">全機種</option></select>
        <label class="mottochk" title="もっとクック（オプション）で作れるメニューも表示し、番号を追加します">
          <input type="checkbox" id="f-motto"> ＋ もっとクック<span class="cnt" id="f-motto-cnt"></span>
        </label>
        <select id="sort">
          <option value="no">番号順</option>
          <option value="timeAsc">調理時間 短い順</option>
          <option value="timeDesc">調理時間 長い順</option>
          <option value="nameJa">名前順</option>
          <option value="madeDesc">つくった順（新しい順）</option>
        </select>
        <select id="size">
          <option value="">全サイズ</option>
          <option value="1.0">1.0L</option>
          <option value="1.6">1.6L</option>
          <option value="2.4">2.4L</option>
        </select>
        <select id="main"><option value="">全材料</option></select>
      </div>
      <div class="catrow">
        <span class="flabel">系統</span>
        <div class="chips" id="catchips"></div>
        <button class="chip catclear" id="cat-clear" type="button" hidden>クリア</button>
      </div>
      <div class="catrow" id="devrow" hidden>
        <span class="flabel">器具</span>
        <div class="chips" id="devchips"></div>
      </div>
      <div class="controls">
        <div class="chips">
          <button class="chip mk" id="mf-fav"  data-mk="fav"  aria-pressed="false">♥ お気に入り</button>
          <button class="chip mk" id="mf-want" data-mk="want" aria-pressed="false">★ 気になる</button>
          <button class="chip mk" id="mf-made" data-mk="made" aria-pressed="false">✓ つくった</button>
          <span class="viewseg">
            <button class="chip vw" id="v-grid"   data-view="grid"   aria-pressed="false">▦ グリッド</button>
            <button class="chip vw" id="v-list"   data-view="list"   aria-pressed="true">≣ リスト</button>
            <button class="chip vw" id="v-detail" data-view="detail" aria-pressed="false">☰ 詳細（材料つき）</button>
          </span>
          <button class="chip" id="f-group" aria-pressed="true">系統ごとに見出し</button>
          <button class="chip" id="f-yoyaku" aria-pressed="false">予約できる</button>
          <button class="chip red" id="f-cloud" aria-pressed="false">クラウド限定</button>
          <button class="chip red" id="f-notcloud" aria-pressed="false">本体だけで作れる</button>
          <span class="viewseg srcseg" role="group" aria-label="出所">
            <button class="chip src" data-src="sharp" aria-pressed="false">公式<span class="cnt" id="f-src-sharp-cnt"></span></button>
            <button class="chip src" data-src="own" aria-pressed="false">自分の<span class="cnt" id="f-src-own-cnt"></span></button>
          </span>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>条件に合うメニューがありません。</div>
</main>

<footer>
  <div style="margin-bottom:10px" id="precache-row">
    <button class="dlbtn" id="precache" type="button">全画像を端末に保存（オフライン用）</button>
    <span class="dlprog" id="dlprog"></span>
  </div>
  <div style="margin-bottom:10px">
    <button class="dlbtn" id="export-backup" type="button">全データを書き出す（バックアップ）</button>
    <button class="dlbtn" id="import-backup" type="button">バックアップから復元</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <span class="dlprog" id="backupprog"></span>
    <div class="dlnote">自分のレシピ・マーク（♥★✓）・機種設定を1つのJSONにまとめます。復元は今のデータに統合されます（以前のマーク書き出しファイルも読めます）。</div>
  </div>
  メニュー情報・写真は <a href="https://cocoroplus.jp.sharp/kitchen/recipe/" target="_blank" rel="noopener">SHARP COCORO KITCHEN</a> より。個人利用の非公式ツールです。
</footer>

<!-- 詳細シート（カードタップでアプリ内表示。オフラインでも材料まで見られる） -->
<div class="overlay" id="overlay" hidden></div>
<div class="modal" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-name">
  <button class="modal-close" id="sheet-close" type="button" aria-label="閉じる">✕</button>
  <div class="modal-scroll" id="sheet-body"></div>
</div>

<!-- 自分のレシピの追加・編集画面 -->
<div class="modal editor" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="ed-title">
  <button class="modal-close" id="ed-close" type="button" aria-label="閉じる">✕</button>
  <div class="modal-scroll" id="ed-scroll">
    <form id="ed-form" class="ed" novalidate autocomplete="off">
      <h2 id="ed-title">レシピを追加</h2>
      <label class="ed-f"><span class="ed-l">料理名 <b>*</b></span><input type="text" name="name" required placeholder="例: 鶏と大根の煮物"></label>
      <div class="ed-f"><span class="ed-l">器具（複数可）</span>
        <div class="chips" id="ed-devices"></div>
        <div class="ed-inline"><input type="text" id="ed-dev-new" placeholder="ほかの器具を追加"><button type="button" class="ed-btn" id="ed-dev-add">追加</button></div>
      </div>
      <label class="ed-f"><span class="ed-l">ホットクックの手動設定</span><input type="text" name="manual" placeholder="例: 手動・炒め 5分（まぜ技あり）"></label>
      <div class="ed-f"><span class="ed-l">系統 <small class="ed-hint" id="ed-auto">料理名から推定中</small></span><select id="ed-cat"></select></div>
      <div class="ed-f"><span class="ed-l">主材料</span><div class="chips" id="ed-mains"></div></div>
      <div class="ed-2">
        <label class="ed-f"><span class="ed-l">人数</span><input type="text" name="servings" placeholder="例: 2人分"></label>
        <label class="ed-f"><span class="ed-l">調理時間（分）</span><input type="number" name="min" min="0" step="1" inputmode="numeric" placeholder="例: 30"></label>
      </div>
      <div class="ed-f"><span class="ed-l">材料</span><div id="ed-mats"></div><button type="button" class="ed-addrow" id="ed-add-mat">＋ 材料を追加</button></div>
      <div class="ed-f"><span class="ed-l">作り方</span><ol id="ed-steps"></ol><button type="button" class="ed-addrow" id="ed-add-step">＋ 手順を追加</button></div>
      <label class="ed-f"><span class="ed-l">タグ（空白区切り）</span><input type="text" name="tags" placeholder="例: 作り置き 弁当"></label>
      <label class="ed-f"><span class="ed-l">メモ</span><textarea name="memo" rows="3"></textarea></label>
      <label class="ed-f"><span class="ed-l">出典URL</span><input type="url" name="url" inputmode="url" placeholder="https://"></label>
      <p class="ed-err" id="ed-err" role="alert" hidden></p>
    </form>
  </div>
  <div class="ed-foot">
    <button type="button" class="ed-cancel" id="ed-cancel">キャンセル</button>
    <button type="submit" class="ed-save" form="ed-form">保存</button>
  </div>
</div>

<!-- 機種オンボーディング（初回のみ自動表示。バッジからいつでも再表示） -->
<div class="modal" id="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="onb-title">
  <div class="onb-body">
    <h2 id="onb-title">お使いの機種を選んでください</h2>
    <p>機種を選ぶと、その機種で作れるメニューだけを表示し、メニュー番号もその機種の番号に合わせます。あとでヘッダーのバッジからいつでも変更できます。</p>
    <select id="onb-model"><option value="">機種を選ぶ…</option></select>
    <label class="onb-motto"><input type="checkbox" id="onb-motto"> もっとクック（オプション）も使う</label>
    <div class="onb-btns">
      <button id="onb-apply" type="button">この機種にする</button>
      <button id="onb-skip" type="button">全機種のまま使う</button>
    </div>
  </div>
</div>

</body>
</html>
